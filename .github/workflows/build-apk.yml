name: Build TITAN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev gettext autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "TITAN project files found."

      - name: Prepare Android SDK and accept licenses
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          # Let Buildozer create/download its SDK toolchain first.
          buildozer android update || true
          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in $SDK"
            find "$SDK" -maxdepth 5 -type f 2>/dev/null | head -n 100
            exit 1
          fi
          mkdir -p "$SDK/licenses"
          # The legacy sdkmanager needs the explicit SDK root argument.
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          yes | "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"
          ls -la "$SDK/build-tools"

      - name: Build TITAN debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: titan-ai-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
