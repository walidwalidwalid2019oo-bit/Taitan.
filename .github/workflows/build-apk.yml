
name: Build TITAN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            openjdk-17-jdk \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            gettext autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "TITAN project files found."

      - name: Initialize Android SDK
        run: |
          buildozer android update || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "Android SDK location: $SDK"
          find "$SDK" -type f -name sdkmanager 2>/dev/null || true

      - name: Install Android SDK build tools
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found. Checking available SDK files:"
            find "$SDK" -maxdepth 4 -type d 2>/dev/null | head -n 80
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          ls "$SDK/build-tools"

      - name: Build TITAN debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: titan-ai-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
